[package]
name = "alyesa"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
crossterm = "0.27"
rustyline = "13.0"
dialoguer = "0.12.0"
dotenvy = "0.15.7"
rusqlite = { version = "0.31.0", features = ["bundled"] }
chrono = "0.4"
textwrap = { version = "0.16.2", features = ["terminal_size"] }
scraper = "0.26.0"
libc = "0.2.186"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true

